{% extends "app.html" %}
{% block head %}<link rel="stylesheet" href="/static/mgmt.css">{% endblock %}
{% block title %}سوزان — دانلود بازیابی{% endblock %}
{% block app_content %}
<div class="mp-wrap">
  <div class="mf-card">
    <div class="mf-icon" style="background:linear-gradient(135deg,#22c55e,#14b8a6)">✅</div>
    <h3 class="mf-title">تأیید کامل شد</h3>
    <p class="mf-sub">رمز حساب و کد پیامکی هر دو تأیید شدند.<br>فایل رمزنگاری‌شده از سطل بازیافت، <b>یک‌بار</b> قابل دانلود است.</p>
    <a class="mf-go" style="display:block;text-decoration:none" href="/manage/restore_dl/{{ mgmt_token }}">📥 دانلود فایل</a>
    <a class="mf-cancel" href="/manage/panel/{{ mgmt_token }}">بازگشت به پنل</a>
  </div>
</div>
{% endblock %}

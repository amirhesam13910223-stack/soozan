<div style="display:flex;gap:6px;background:#0d142899;border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:18px">
  {% set _m = 'login' if request.path.startswith('/login') else 'register' %}
  <a href="/login" style="flex:1;text-align:center;padding:9px;border-radius:9px;text-decoration:none;font-size:14px;transition:all .2s;{% if _m=='login' %}background:linear-gradient(135deg,var(--acc),#ff8c5a);color:#fff;font-weight:600;box-shadow:0 4px 14px #ff7a3d33{% else %}color:var(--dim){% endif %}">🔐 ورود</a>
  <a href="/register" style="flex:1;text-align:center;padding:9px;border-radius:9px;text-decoration:none;font-size:14px;transition:all .2s;{% if _m=='register' %}background:linear-gradient(135deg,var(--acc),#ff8c5a);color:#fff;font-weight:600;box-shadow:0 4px 14px #ff7a3d33{% else %}color:var(--dim){% endif %}">✨ ثبت‌نام</a>
</div>

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask cryptography jdatetime requests Pillow waitress
      
      - name: Syntax check
        run: python -m compileall -q .

      - name: Run comprehensive test suite
        env:
          SOOZAN_DEV_MODE: "1"
        run: |
          chmod +x run.sh test_sozan_v1.py 2>/dev/null || true
          python3 test_sozan_v1.py
      - run: python3 test_sozan_v2.py

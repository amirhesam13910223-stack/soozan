<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوزان — Auth</title>
    <link rel="stylesheet" href="/static/mgmt.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e4e4e4;
        }
    </style>
</head>
<body>
<main class='auth-wrap'>
<div class="wrap" style="max-width:430px;margin-top:8vh">
  <div style="text-align:center;margin-bottom:26px" data-reveal>
    <div class="brand" style="justify-content:center">
      <span class="logo">🔥</span> سوزان
    </div>
    <p style="color:var(--dim);font-size:13px;margin-top:10px">
      پلتفرم اشتراک محتوای خودتخریب‌شونده
    </p>
  </div>

  <div class="card pad" data-reveal>
      {% include "auth_tabs.html" %}
{% if error %}<div class="alert alert-err">{{ error }}</div>{% endif %}
    {% if success %}<div class="alert alert-ok">{{ success }}</div>{% endif %}

    <form method="post" id="form">
      <div class="field">
        <label class="label" for="username">نام کاربری</label>
        <input class="input" type="text" id="username" name="username" required
               minlength="3" maxlength="32" pattern="[a-zA-Z0-9_-]+"
               autocomplete="username" placeholder="حروف، عدد، - یا _"
               value="{{ username or '' }}">
      </div>

      <div class="field">
        <label class="label" for="password">رمز عبور</label>
        <div style="position:relative">
          <input class="input" type="password" id="password" name="password" required
                 minlength="8" placeholder="حداقل ۸ کاراکتر"
                 autocomplete="{% if mode=='login' %}current-password{% else %}new-password{% endif %}"
                 style="padding-inline-end:46px">
          <button type="button" id="eye" style="position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:17px;cursor:pointer;padding:6px">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn btn-acc btn-block" id="submitBtn">
        {% if mode == "login" %}🔐 ورود به حساب{% else %}✨ ایجاد حساب{% endif %}
      </button>
    </form>

    <p style="text-align:center;margin-top:18px;font-size:12px;color:var(--mute)">
      محتوا پس از نمایش، برای همیشه می‌سوزد 🔥
    </p>
  </div>
</div>
{% include "toast.html" %}
</body>
</html>

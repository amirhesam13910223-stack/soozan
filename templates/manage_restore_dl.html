{% extends "app.html" %}
{% block head %}<link rel="stylesheet" href="/static/mgmt.css">{% endblock %}
{% block title %}سوزان — دانلود بازیابی{% endblock %}
{% block app_content %}
<div class="mp-wrap">
  <div class="mp-section" style="max-width:440px;margin:30px auto;text-align:center">
    <h3>✅ تأیید کامل شد</h3>
    <p style="color:var(--dim);font-size:12.5px;line-height:1.8;margin-bottom:14px">رمز حساب و کد پیامکی تأیید شد. فایل رمزنگاری‌شده از سطل بازیافت دانلود می‌شود (یک‌بار).</p>
    <a class="mp-btn mp-btn-primary" style="text-decoration:none" href="/manage/restore_dl/{{ mgmt_token }}">📥 دانلود فایل</a>
    <a class="mp-link" href="/manage/panel/{{ mgmt_token }}">بازگشت به پنل</a>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}کد تأیید — سوزان{% endblock %}
{% block body %}
<main style="min-height:100vh;display:grid;place-items:center;padding:24px 16px"><div class="wrap" style="max-width:400px;width:100%">
  <div class="card pad" data-demo-code="{{ demo_code }}">
    {% if error %}<div class="badge badge-bad" style="display:block;margin-bottom:12px">{{ error }}</div>{% endif %}
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-size:40px">📨</div>
      <h2 style="font-size:17px;font-weight:700;margin-top:6px">{{ desc }}</h2>
      <p style="color:var(--dim);font-size:12.5px;margin-top:4px">کد به شماره {{ phone }} ارسال شد · ۲ دقیقه اعتبار · ۴ بار تلاش</p>
    </div>
    <div class="badge badge-warn" style="display:block;text-align:center;margin-bottom:14px;padding:10px">
      🧪 حالت دمو: کد = <b style="letter-spacing:4px">{{ demo_code }}</b>
    </div>
    <form method="post" action="/settings/otp/verify">
      <div class="field"><input class="input" name="code" inputmode="numeric" maxlength="6" required placeholder="------"
         style="direction:ltr;text-align:center;letter-spacing:6px;font-family:var(--mono)"></div>
      <button class="btn btn-acc btn-block" type="submit">تأیید کد</button>
    </form>
    <a class="btn btn-ghost btn-block" href="/settings" style="margin-top:10px">انصراف</a>
  </div>
</div></main>
{% endblock %}
{% block footer %}{% endblock %}

{% extends "base.html" %}
{% block title %}سوزان — ورود پنل مدیریت{% endblock %}
{% block body %}
<div class="wrap" style="max-width:430px;margin:0 auto;padding:24px 16px">
  <div style="text-align:center;margin-bottom:18px" data-reveal>
    <span style="font-size:44px">🔐</span>
    <h1 style="font-size:22px;font-weight:700;margin-top:8px">ورود پنل مدیریت</h1>
    <p style="color:var(--dim);font-size:13px;margin-top:4px">کد مدیریت فایل را وارد کن</p>
  </div>
  {% if error %}<div class="alert alert-err">{{ error }}</div>{% endif %}
  <div class="card pad">
    <form method="post" action="/manage">
      <div class="field">
        <label class="label" for="admin_code">کد مدیریت</label>
        <input class="input" id="admin_code" name="admin_code" required
               style="font-family:var(--mono);letter-spacing:2px">
      </div>
      <button class="btn btn-acc btn-block" type="submit">ادامه ←</button>
    </form>
  </div>
</div>
{% endblock %}
